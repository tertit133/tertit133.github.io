<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена — Адем-Тахир Алтун</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 20px; box-sizing: border-box;
        background: #0b0f17; color: #e7ecf5; text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      .code {
        font-size: clamp(72px, 18vw, 120px); font-weight: 800; line-height: 1; margin: 0;
        background: linear-gradient(90deg, #7c9cff, #b48cff);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { color: #98a3b8; font-size: 18px; margin: 16px 0 28px; }
      a {
        display: inline-block; padding: 14px 24px; border-radius: 12px; font-weight: 600; text-decoration: none;
        background: linear-gradient(135deg, #7c9cff, #b48cff); color: #0b0f17;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="code">404</h1>
      <p>Такой страницы нет. Возможно, ссылка устарела.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
