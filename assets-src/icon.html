<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Иконка для iOS (apple-touch-icon): квадрат без прозрачности, углы iOS скругляет сама -->
<style>
  html, body { margin: 0; background: #0b0f17; }
  .icon {
    width: 180px; height: 180px; display: grid; place-items: center;
    background: linear-gradient(135deg, #7c9cff, #b48cff);
    color: #0b0f17; font: 800 72px 'Segoe UI', Arial, sans-serif;
  }
</style>
</head>
<body><div class="icon">АА</div></body>
