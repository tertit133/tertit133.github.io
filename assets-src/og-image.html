<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif; color: #e7ecf5;
    background:
      radial-gradient(700px 400px at 10% 0%, rgba(124,156,255,.28), transparent),
      radial-gradient(600px 380px at 95% 100%, rgba(180,140,255,.22), transparent),
      #0b0f17;
    display: flex; flex-direction: column; justify-content: center; padding: 0 90px; box-sizing: border-box;
  }
  .mark { width: 96px; height: 96px; border-radius: 26px; background: linear-gradient(135deg,#7c9cff,#b48cff); color: #0b0f17; font-weight: 800; font-size: 38px; display: grid; place-items: center; margin-bottom: 36px; }
  h1 { margin: 0; font-size: 76px; line-height: 1.05; letter-spacing: -1px; }
  .role { margin: 14px 0 34px; font-size: 40px; font-weight: 600; color: #9fb4ff; }
  .chips { display: flex; gap: 14px; }
  .chip { border: 2px solid #233049; background: #141b2b; border-radius: 999px; padding: 8px 24px; font-size: 28px; font-weight: 600; }
  .url { position: absolute; right: 90px; bottom: 56px; font-size: 28px; color: #98a3b8; }
</style>
</head>
<body>
  <div class="mark">АА</div>
  <h1>Адем-Тахир Алтун</h1>
  <div class="role">Junior Software Developer</div>
  <div class="chips"><span class="chip">C++</span><span class="chip">C#</span><span class="chip">Python</span><span class="chip">JavaScript</span></div>
  <div class="url">tertit133.github.io</div>
</body>
</html>
